services:
  seekmoney-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seekmoney-ai
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./analysis-results:/app/analysis-results
      - ./logs:/app/logs
      - ./.env:/app/.env
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
