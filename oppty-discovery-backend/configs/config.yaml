# ==============================================================================
# 商机发现助手 (Oppty Discovery Assistant) - 后端服务全局配置
# 所有技术组件均抽取到本配置文件集中管理，便于后续容器化部署与机房迁移
# ==============================================================================

server:
  # 服务监听端口
  port: 8080
  # 运行模式: debug / release / test
  mode: "debug"
  # 应用名称
  appName: "商机发现助手"

# ------------------------------------------------------------------------------
# 1. 数据库配置 (PostgreSQL 17)
# 复用服务器 192.168.8.206 上的 PostgreSQL 17 (AnyDocs-postgres 或 Supabase PG)
# ------------------------------------------------------------------------------
database:
  host: "192.168.8.206"
  port: 5432
  user: "postgres"
  password: "postgres123!@#"
  # 独立数据库实例名称，按工程命名隔离
  dbname: "oppty_discovery"
  sslmode: "disable"
  maxIdleConns: 10
  maxOpenConns: 50

# ------------------------------------------------------------------------------
# 2. Supabase BaaS 平台配置
# 用于无感邮箱验证码登录 (OTP)、用户会话管理
# 对应服务器 192.168.8.206 上的 Kong API 网关 (8000) 与 Studio (8000)
# ------------------------------------------------------------------------------
supabase:
  # Supabase Kong API 网关统一访问入口
  apiUrl: "http://192.168.8.206:8000"
  # Supabase JWT 鉴权密钥 (用于验证签名与自解析)
  jwtSecret: "6128de580367207db74b707749b8fb04"
  # 服务端 Service Role Key (或匿名 Anon Key)
  serviceKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzg4MzQxNzIzLCJleHAiOjE5NDYwMjE3MjN9.O07OEku7ss1N_vrmkZX6_xEi2FIQGSWY6ACVzBfwuIU"

# ------------------------------------------------------------------------------
# 邮件服务配置 (基于 Supabase Auth 发送邮箱验证码)
# ------------------------------------------------------------------------------
email:
  # 是否使用开发环境测试邮件
  use_inbucket: false
  # Inbucket API 地址
  inbucket_url: "http://192.168.8.206:19000"
  # Supabase API 网关地址
  supabase_url: "http://192.168.8.206:8000"
  # Supabase Anon 匿名 API Key (来自生产环境配置)
  anon_key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzg4MzQxNzIzLCJleHAiOjE5NDYwMjE3MjN9.O07OEku7ss1N_vrmkZX6_xEi2FIQGSWY6ACVzBfwuIU"
  # 验证码有效期 (分钟)
  code_expire_minutes: 5

# ------------------------------------------------------------------------------
# 3. MinIO 对象存储配置 (S3 兼容)
# 用于持久化存储商机 Markdown 导出报告和 HTML 预览文档
# 对应服务器 192.168.8.206 上的 minio-server
# ------------------------------------------------------------------------------
minio:
  # S3 API 访问端点 (宿主机 9000 端口)
  endpoint: "192.168.8.206:9000"
  # 管理凭证 Access Key
  accessKey: "admin"
  # 管理凭证 Secret Key
  secretKey: "Admin@206"
  # 是否启用 HTTPS (局域网内使用 false)
  useSSL: false
  # 商机发现助手专属存储桶命名
  bucketName: "oppty-discovery"
  # 外网/局域网浏览器直接预览的基础 URL
  publicBaseUrl: "http://192.168.8.206:9000/oppty-discovery"

# ------------------------------------------------------------------------------
# 4. 大模型 (LLM) 分析引擎配置
# 接入部署在 192.168.8.206:3002 的 Qwen / GLM 兼容大模型服务
# ------------------------------------------------------------------------------
llm:
  # 模型 API Base URL (兼容 OpenAI / GLM 格式)
  baseUrl: "http://192.168.8.206:3002/v1"
  # 调用 API Key
  apiKey: "sk-b4R1jMvuDD3ySozNK280Bt96kgXAhOUAwiPHrfGLzyBPtucl"
  # 分析推理模型名称
  modelName: "qwen3.6-flash"
  # 生成温度
  temperature: 0.7
  # 请求超时时间 (秒)
  timeoutSeconds: 60
  # 文本向量化 (Embedding) 模型名称 (通义千问官方最新向量模型，1536维)
  embeddingModel: "text-embedding-v4"
  # 向量化单批次文本上限 (通义千问限制最大10条)
  embeddingBatchSize: 10
  # 向量化 API 接口端点
  embeddingUrl: "http://192.168.8.206:3002/v1/embeddings"

# ------------------------------------------------------------------------------
# 5. TikHub / 社交媒体爬虫数据源配置
# ------------------------------------------------------------------------------
tikhub:
  # TikHub API 网关地址
  baseUrl: "https://api.tikhub.io"
  # TikHub 调用凭证 Token (已安全抽离至本地私密 .env 文件或系统环境变量 TIKHUB_API_TOKEN，切勿硬编码提交代码仓库)
  apiToken: ""
  # 请求重试次数
  retryCount: 3
  # 单次请求超时时间 (秒)
  timeoutSeconds: 30
